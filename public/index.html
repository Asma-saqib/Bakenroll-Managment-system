<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bake n' Roll — Dashboard</title>
  <meta name="description" content="Bake n' Roll internal management system — inventory, orders, customers and sales analytics." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<!-- ── Sidebar ─────────────────────────────────────────────── -->
<aside id="sidebar">
  <div class="sidebar-brand">
    <div class="brand-icon-wrap">🥐</div>
    <div class="brand-name">Bake n' Roll</div>
    <div class="brand-sub">@__bakenroll · Karachi</div>
  </div>
  <nav class="sidebar-nav">
    <a class="nav-item" data-page="dashboard" href="#dashboard" id="nav-dashboard">
      <span class="nav-icon">📊</span> Dashboard
    </a>
    <a class="nav-item" data-page="products" href="#products" id="nav-products">
      <span class="nav-icon">🧁</span> Products
    </a>
    <a class="nav-item" data-page="customers" href="#customers" id="nav-customers">
      <span class="nav-icon">👤</span> Customers
    </a>
    <a class="nav-item" data-page="orders" href="#orders" id="nav-orders">
      <span class="nav-icon">📦</span> Orders
    </a>
    <a class="nav-item" data-page="payments" href="#payments" id="nav-payments">
      <span class="nav-icon">💳</span> Payments
    </a>
    <a class="nav-item" data-page="reports" href="#reports" id="nav-reports">
      <span class="nav-icon">📈</span> Reports
    </a>
  </nav>
  <div class="sidebar-footer">
    <button id="logoutBtn">⬅ Sign Out</button>
  </div>
</aside>

<!-- ── Main wrapper ─────────────────────────────────────────── -->
<div id="main-wrapper">
  <header id="topbar">
    <h1 id="page-title">Dashboard</h1>
    <div class="topbar-right">
      <span class="topbar-user">Signed in as <span id="topbar-username">admin</span></span>
      <button id="topbar-action-btn"></button>
    </div>
  </header>
  <main id="page-content">
    <div class="loading">Loading…</div>
  </main>
</div>

<!-- ── Toast Container ────────────────────────────────────── -->
<div id="toast-container"></div>

<!-- ── Modal Container ────────────────────────────────────── -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal-box">
    <div class="modal-header">
      <span class="modal-title" id="modal-title">Modal</span>
      <button class="modal-close" id="modal-close-btn">✕</button>
    </div>
    <div id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<script src="/js/app.js" type="module"></script>
</body>
</html>
